[package]
name = "squirreldisk"
version = "0.4.0"
description = "Fast, native disk usage analyzer"
authors = ["Adileo Barone", "Hernan Casillas", "SquirrelDisk contributors"]
license = "AGPL-3.0-only"
repository = "https://github.com/hernancasillas/squirreldisk"
edition = "2021"
rust-version = "1.77"

[lib]
name = "squirreldisk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.37", default-features = false, features = ["disk"] }
rayon = "1.10"
trash = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
